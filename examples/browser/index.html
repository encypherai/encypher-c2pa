<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encypher C2PA local verifier</title>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, sans-serif; }
    body { max-width: 760px; margin: 4rem auto; padding: 0 1.25rem; color: #17202a; }
    h1 { margin-bottom: .25rem; }
    .lede { color: #53606d; margin-top: 0; }
    .panel { border: 1px solid #d9dee3; border-radius: 12px; padding: 1.25rem; }
    input { display: block; margin: 1rem 0; }
    button { border: 0; border-radius: 8px; padding: .7rem 1rem; background: #173f5f; color: white; font-weight: 700; }
    button:disabled { opacity: .5; }
    pre { margin-top: 1.25rem; padding: 1rem; border-radius: 8px; background: #f5f7f9; white-space: pre-wrap; overflow-wrap: anywhere; }
    .valid { color: #176b3a; }
    .invalid { color: #9d261d; }
  </style>
</head>
<body>
  <h1>Verify a Content Credential locally</h1>
  <p class="lede">The file stays in this browser. No upload, API key, account, or network verification request.</p>
  <main class="panel">
    <label for="asset"><strong>Choose an asset</strong></label>
    <input id="asset" type="file">
    <button id="verify" disabled>Verify</button>
    <pre id="result" aria-live="polite">Loading verifier...</pre>
  </main>
  <script type="module" src="./verify.js"></script>
</body>
</html>
