[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "encypher-c2pa"
# No version here: maturin takes it from the Rust workspace. A duplicated
# PEP 440 string silently drifted to 1.0.0rc6 while the crates moved on.
dynamic = ["version"]
description = "Offline, verification-only C2PA SDK"
readme = "../../README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Encypher Corporation" }]
keywords = ["c2pa", "content-credentials", "provenance", "verification"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/encypherai/encypher-c2pa"
Documentation = "https://github.com/encypherai/encypher-c2pa#readme"
Issues = "https://github.com/encypherai/encypher-c2pa/issues"

[tool.maturin]
include = [{ path = "LICENSE", format = "sdist" }, { path = "NOTICE", format = "sdist" }]
manifest-path = "Cargo.toml"
module-name = "encypher_c2pa._native"
python-source = "python"
features = ["pyo3/extension-module"]
