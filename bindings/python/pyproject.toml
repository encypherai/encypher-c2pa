[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "encypher-c2pa"
version = "1.0.0rc1"
description = "Offline, verification-only C2PA SDK"
readme = "../../README.md"
requires-python = ">=3.9"
license = "Apache-2.0 OR MIT"
authors = [{ name = "Encypher, Inc." }]
keywords = ["c2pa", "content-credentials", "provenance", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/encypherai/encypher-c2pa"
Documentation = "https://github.com/encypherai/encypher-c2pa#readme"
Issues = "https://github.com/encypherai/encypher-c2pa/issues"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "encypher_c2pa._native"
python-source = "python"
features = ["pyo3/extension-module"]
