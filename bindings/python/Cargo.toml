[package]
name = "encypher-c2pa-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Python bindings for the Encypher C2PA verifier"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
encypher-c2pa = { version = "=1.9.0", path = "../../crates/encypher-c2pa", features = ["caller-verified-binding"] }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
serde_json = { workspace = true }
