[package]
name = "encypher-c2pa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
description = "Offline, verification-only C2PA SDK"
keywords = ["c2pa", "content-credentials", "provenance", "verification"]
categories = ["cryptography", "multimedia"]

[features]
default = ["telemetry"]
telemetry = ["dep:ureq"]

[dependencies]
c2pa-core = { package = "encypher-c2pa-core", version = "=1.0.0-rc.8", path = "../../internal/c2pa-core" }
c2pa-formats = { package = "encypher-c2pa-formats", version = "=1.0.0-rc.8", path = "../../internal/c2pa-formats" }
c2pa-trust = { package = "encypher-c2pa-trust", version = "=1.0.0-rc.8", path = "../../internal/c2pa-trust" }
c2pa-validate = { package = "encypher-c2pa-validate", version = "=1.0.0-rc.8", path = "../../internal/c2pa-validate" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing"] }
ureq = { version = "2.12.1", optional = true, default-features = false, features = ["json", "tls"] }
