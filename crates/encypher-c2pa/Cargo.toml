[package]
name = "encypher-c2pa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
description = "Offline, verification-only C2PA SDK"
keywords = ["c2pa", "content-credentials", "provenance", "verification"]
categories = ["cryptography", "multimedia"]

[features]
default = ["telemetry"]
telemetry = ["dep:ureq"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, features = ["oid"] }
hex = { workspace = true }
thiserror = { workspace = true }
c2pa-text = { workspace = true }
x509-cert = { workspace = true, features = ["pem"] }
spki = { workspace = true }
const-oid = { workspace = true }
der = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing"] }
p256 = { workspace = true, features = ["ecdsa", "pkcs8"] }
p384 = { workspace = true, features = ["ecdsa", "pkcs8"] }
p521 = { workspace = true, features = ["ecdsa", "pkcs8"] }
ecdsa = { workspace = true }
rsa = { workspace = true, features = ["sha2"] }
ed25519-dalek = { workspace = true, features = ["pkcs8"] }
pkcs8 = { workspace = true }
signature = { workspace = true }
rand_core = { workspace = true }
cms = { workspace = true }
x509-tsp = { workspace = true }
unicode-normalization = "0.1"
miniz_oxide = "0.8"
ureq = { version = "2.12.1", optional = true, default-features = false, features = ["json", "tls"] }

[dev-dependencies]
time = { workspace = true, features = ["macros"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

# The elliptic-curve stack reaches `getrandom` transitively (ecdsa -> p256 ->
# elliptic-curve -> crypto-bigint -> rand_core), and on wasm32 that crate
# refuses to compile unless a backend is selected. Until now the browser
# binding declared this itself, which meant the published library did not
# actually build for a target the README says it supports: a consumer taking
# `encypher-c2pa` into the browser hit a compile error in a transitive
# dependency. Declaring it here makes the library standalone-correct on wasm32.
#
# Not optional, so it creates no implicit Cargo feature - the surface gate
# locks the feature map and would reject one.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
