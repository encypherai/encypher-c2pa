[package]
name = "encypher-c2pa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
description = "Verification-only C2PA 2.4 and CAWG SDK, offline by default"
keywords = ["c2pa", "content-credentials", "provenance", "verification"]
categories = ["cryptography", "multimedia"]
# The two integration suites load fixtures from the workspace `tests/fixtures`
# directory, which is outside this package. Shipping the suites without their
# fixtures makes `cargo test` inside the unpacked crate fail on missing files,
# which a reviewer hit. The unit tests carry their own fixtures under `src/`
# and still ship, so the published artifact stays auditable.
exclude = ["tests/**"]

[features]
default = ["telemetry", "online"]
telemetry = ["dep:ureq"]
# Opt-in online checks. The feature compiles the fetcher; it never turns
# fetching on. Without it a build cannot reach the network for verification at
# all, which is what an air-gapped deployment wants to be able to prove.
online = ["dep:ureq"]
# Store-level CAWG identity evaluation for callers that verify the asset's
# content binding themselves. Off by default: the API it exposes reports
# identity without checking content, so only such a caller should enable it.
caller-verified-binding = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, features = ["oid"] }
hex = { workspace = true }
thiserror = { workspace = true }
c2pa-text = { workspace = true }
x509-cert = { workspace = true, features = ["pem"] }
spki = { workspace = true }
const-oid = { workspace = true }
der = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing"] }
# Curve `std` enables getrandom 0.4, which verification does not need. Enable
# std only on the table backend: its lazy precomputed tables require a
# synchronization implementation, including on wasm32-unknown-unknown.
primeorder = { version = "0.14", default-features = false, features = ["std"] }
p256 = { workspace = true, features = ["alloc", "ecdsa", "pem", "pkcs8", "precomputed-tables"] }
p384 = { workspace = true, features = ["alloc", "ecdsa", "pem", "pkcs8", "precomputed-tables"] }
p521 = { workspace = true, features = ["alloc", "ecdsa", "pem", "pkcs8", "precomputed-tables"] }
ecdsa = { workspace = true }
rsa = { workspace = true, features = ["sha2"] }
ed25519-dalek = { workspace = true, features = ["pkcs8"] }
pkcs8 = { workspace = true }
signature = { workspace = true }
rand_core = { workspace = true }
cms = { workspace = true }
x509-tsp = { workspace = true }
# ML-DSA verification (FIPS 204; RFC 9964 COSE, RFC 9881 X.509). Pure Rust
# and no_std-capable, so it builds for wasm32; `alloc` keeps the large key
# and matrix values off the stack. No `getrandom`/`pkcs8`: this crate only
# verifies, and parses SPKI with the existing `spki` stack.
ml-dsa = { workspace = true, features = ["alloc"] }
unicode-normalization = "0.1"
miniz_oxide = "0.9"
brotli = { version = "9", default-features = false, features = ["std"] }
# Zstandard decoding for WARC records (`std` reader, `hash` frame checksums);
# pure Rust, MSRV 1.87.
ruzstd = { version = "0.9", default-features = false, features = ["std", "hash"] }
ureq = { workspace = true, optional = true }
url = "2.5"

[dev-dependencies]
time = { workspace = true, features = ["macros"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# JSON Schema draft 2020-12 validator (MIT OR Apache-2.0), used only by the
# crJSON schema-conformance test. Never linked into the published library.
boon = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `getrandom` 0.2 is reached through `rand_core` 0.6 (this crate's own
# `rand_core` with its `getrandom` feature, and rsa), and on wasm32 that crate
# refuses to compile unless a backend is selected. Until now the browser
# binding declared this itself, which meant the published library did not
# actually build for a target the README says it supports: a consumer taking
# `encypher-c2pa` into the browser hit a compile error in a transitive
# dependency. Declaring it here makes the library standalone-correct on wasm32.
#
# Not optional, so it creates no implicit Cargo feature - the surface gate
# locks the feature map and would reject one.
# Scoped to the browser target specifically, not all of wasm32. A reviewer
# found that a bare `target_arch = "wasm32"` predicate also captured
# wasm32-wasip1, where the pre-change tree resolved getrandom with `std` and
# this would have forced `js`, `js-sys` and `wasm-bindgen` onto existing WASI
# consumers.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
