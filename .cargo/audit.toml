[advisories]
# RUSTSEC-2023-0071 concerns timing leakage during RSA private-key operations.
# This verification-only workspace performs RSA public-key verification only.
# No RSA private key is loaded, generated, decrypted, or used to sign.
# RUSTSEC-2026-0387 concerns timing variability in crypto-bigint 0.5 operations
# meant to run in constant time. It reaches this workspace only through the
# elliptic-curve 0.13 stack (p256, p384, p521), whose fix requires
# crypto-bigint 0.7. Production code here verifies ECDSA signatures over
# public keys, public signatures and public messages; only test fixtures load
# an ECDSA private key, so no secret value passes through those operations.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0387"]
informational_warnings = ["unmaintained"]
severity_threshold = "low"
