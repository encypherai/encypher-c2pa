name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  crates:
    name: Publish Rust crates
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Publish support crates and public packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          packages=(
            encypher-c2pa-cbor
            encypher-c2pa-core
            encypher-c2pa-formats
            encypher-c2pa-trust
            encypher-c2pa-crypto
            encypher-c2pa-validate
            encypher-c2pa
            encypher-c2pa-cli
          )
          for package in "${packages[@]}"; do
            for attempt in 1 2 3 4 5; do
              if cargo publish --locked -p "$package"; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                exit 1
              fi
              sleep 20
            done
          done

  python-wheels:
    name: Python ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-13
            target: x86_64
          - os: macos-14
            target: aarch64
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --manifest-path bindings/python/Cargo.toml --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  python-sdist:
    name: Python sdist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path bindings/python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz

  pypi:
    name: Publish Python package
    needs: [python-wheels, python-sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  npm:
    name: Publish browser WASM package
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: wasm-pack build bindings/wasm --target web --release --out-dir pkg
      - run: node scripts/package-wasm.mjs
      - run: node scripts/test-wasm.mjs
      - name: Publish to npm
        working-directory: bindings/wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          # A prerelease must never take the `latest` dist-tag: npm publish
          # defaults to `latest`, which would hand every plain
          # `npm i @encypher/c2pa` a release candidate.
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          echo "publishing $version to dist-tag $dist_tag"
          npm publish --provenance --access public --tag "$dist_tag"
