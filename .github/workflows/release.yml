name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  crates:
    name: Publish Rust crates
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Publish support crates and public packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          packages=(
            encypher-c2pa-cbor
            encypher-c2pa-core
            encypher-c2pa-formats
            encypher-c2pa-trust
            encypher-c2pa-crypto
            encypher-c2pa-validate
            encypher-c2pa
            encypher-c2pa-cli
          )
          for package in "${packages[@]}"; do
            for attempt in 1 2 3 4 5; do
              if cargo publish --locked -p "$package"; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                exit 1
              fi
              sleep 20
            done
          done

  python-wheels:
    name: Python ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          # macOS x86_64 cross-builds from the arm64 image. The macos-13
          # Intel runner is retired: its job sat unassigned until the run
          # timed out, and because `pypi` needs every wheel, that one
          # missing runner blocked the whole Python release.
          - os: macos-14
            target: x86_64
          - os: macos-14
            target: aarch64
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --manifest-path bindings/python/Cargo.toml --out dist
          manylinux: auto
        env:
          # ring's C sources read __ARM_ARCH to select the ARM assembler
          # profile. The aarch64 cross-gcc inside maturin's manylinux
          # container does not define it, so ring's build aborts with
          # `#error "ARM assembler must define __ARM_ARCH"` and the linux
          # aarch64 wheel never builds. Native aarch64 compilers define it
          # themselves, which is why only the cross build failed.
          CFLAGS_aarch64_unknown_linux_gnu: -D__ARM_ARCH=8
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.os }}-${{ matrix.target }}-${{ strategy.job-index }}
          path: dist/*.whl

  python-sdist:
    name: Python sdist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path bindings/python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz

  pypi:
    name: Publish Python package
    needs: [python-wheels, python-sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  npm:
    name: Publish browser WASM package
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted publishing (OIDC): no registry-url here on purpose -
      # setup-node's registry-url writes an .npmrc _authToken placeholder that
      # errors when NODE_AUTH_TOKEN is unset. npm >= 11.5.1 is required for
      # OIDC; Node 22 bundles npm 10, so upgrade the CLI explicitly.
      - run: npm install -g npm@latest
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: wasm-pack build bindings/wasm --target web --release --out-dir pkg
      - run: node scripts/package-wasm.mjs
      - run: node scripts/test-wasm.mjs
      - name: Publish to npm (OIDC trusted publishing)
        working-directory: bindings/wasm/pkg
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          # A prerelease must never DISPLACE a stable `latest`: npm publish
          # defaults to `latest`, which would hand every plain
          # `npm i @encypherai/c2pa` a release candidate.
          #
          # But the first-ever publish of a package takes `latest`
          # regardless of --tag, and OIDC trusted publishing cannot run
          # `npm dist-tag add` (npm/cli#8547 - only `npm publish` is
          # supported), so rc.6 pinned `latest` and no later release could
          # move it: plain installs kept getting the first RC ever cut.
          #
          # `npm publish --tag` is the only lever OIDC gives us, so a
          # prerelease claims `latest` too while no stable release exists
          # to protect. Once 1.0.0 ships it takes `latest` and every later
          # prerelease goes to `next` alone, which is the original intent.
          case "$version" in
            *-*)
              current=$(npm view "$name@latest" version 2>/dev/null || true)
              case "$current" in
                "" | *-*) dist_tag=latest ;;
                *) dist_tag=next ;;
              esac
              ;;
            *) dist_tag=latest ;;
          esac
          echo "publishing $version to dist-tag $dist_tag"
          # No token: authentication is the OIDC exchange against the trusted
          # publisher configured on npmjs.com (org encypherai, this repo,
          # release.yml, environment release). Provenance is attached by
          # default under trusted publishing.
          npm publish --access public --tag "$dist_tag"
