name: Trust snapshot drift

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compare packaged trust snapshot with upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check trust sources for certificate changes
        run: scripts/refresh-trust-snapshot --check
        env:
          GITHUB_TOKEN: ${{ github.token }}
