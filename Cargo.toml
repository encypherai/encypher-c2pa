[workspace]
resolver = "2"
members = [
  "crates/encypher-c2pa",
  "crates/encypher-c2pa-cli",
  "bindings/c",
  "bindings/python",
  "bindings/wasm",
]
default-members = ["crates/encypher-c2pa", "crates/encypher-c2pa-cli"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/encypherai/encypher-c2pa"
homepage = "https://encypher.com"
authors = ["Encypher Corporation"]
readme = "README.md"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
anyhow = "1"
c2pa-text = "3.0.0"
x509-cert = "0.2"
spki = "0.7"
const-oid = "0.9"
der = "0.7"
time = "0.3"
p256 = "0.13"
p384 = "0.13"
p521 = "0.13.3"
ecdsa = "0.16"
rsa = "0.9"
ed25519-dalek = "2"
pkcs8 = "0.10"
signature = "2"
rand_core = { version = "0.6", features = ["getrandom"] }
cms = "0.2.3"
x509-tsp = "0.1.0"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.release.package.encypher-c2pa-wasm]
opt-level = "s"
