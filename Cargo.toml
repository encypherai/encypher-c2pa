[workspace]
resolver = "2"
members = [
  "crates/encypher-c2pa",
  "crates/encypher-c2pa-cli",
  "bindings/c",
  "bindings/python",
  "bindings/wasm",
]
default-members = ["crates/encypher-c2pa", "crates/encypher-c2pa-cli"]

[workspace.package]
version = "1.0.5"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/encypherai/encypher-c2pa"
homepage = "https://encypher.com"
authors = ["Encypher Corporation"]
readme = "README.md"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
anyhow = "1"
c2pa-text = "3.0.0"
x509-cert = "0.3"
spki = "0.8"
const-oid = "0.10"
der = "0.8"
time = "0.3"
p256 = "0.14"
p384 = "0.14"
p521 = "0.14.0"
ecdsa = "0.17"
rsa = "0.9"
ed25519-dalek = "3"
pkcs8 = "0.11"
signature = "3"
rand_core = { version = "0.6", features = ["getrandom"] }
cms = "0.2.3"
x509-tsp = "0.1.0"
ureq = { version = "2.12.1", default-features = false, features = ["json", "tls"] }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.release.package.encypher-c2pa-wasm]
opt-level = "s"
