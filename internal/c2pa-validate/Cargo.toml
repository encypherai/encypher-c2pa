[package]
name = "encypher-c2pa-validate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
description = "C2PA validation engine used by the Encypher verifier"

[lib]
name = "c2pa_validate"

[dependencies]
c2pa-cbor = { package = "encypher-c2pa-cbor", version = "=1.0.0-rc.6", path = "../c2pa-cbor" }
c2pa-core = { package = "encypher-c2pa-core", version = "=1.0.0-rc.6", path = "../c2pa-core" }
c2pa-crypto = { package = "encypher-c2pa-crypto", version = "=1.0.0-rc.6", path = "../c2pa-crypto" }
c2pa-trust = { package = "encypher-c2pa-trust", version = "=1.0.0-rc.6", path = "../c2pa-trust" }
c2pa-formats = { package = "encypher-c2pa-formats", version = "=1.0.0-rc.6", path = "../c2pa-formats" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["parsing"] }
ed25519-dalek = { workspace = true }
cms = { workspace = true }
der = { workspace = true }
const-oid = { workspace = true }
x509-cert = { workspace = true }

[dev-dependencies]
time = { workspace = true, features = ["macros"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
