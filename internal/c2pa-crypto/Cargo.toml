[package]
name = "encypher-c2pa-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
description = "Cryptographic primitives used by the Encypher C2PA verifier"

[lib]
name = "c2pa_crypto"

[dependencies]
c2pa-cbor = { package = "encypher-c2pa-cbor", version = "=1.0.0-rc.9", path = "../c2pa-cbor" }
thiserror = { workspace = true }
sha2 = { workspace = true }
signature = { workspace = true }
p256 = { workspace = true, features = ["ecdsa", "pkcs8"] }
p384 = { workspace = true, features = ["ecdsa", "pkcs8"] }
p521 = { workspace = true, features = ["ecdsa", "pkcs8"] }
rsa = { workspace = true, features = ["sha2"] }
ed25519-dalek = { workspace = true, features = ["pkcs8"] }
x509-cert = { workspace = true }
spki = { workspace = true }
der = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

