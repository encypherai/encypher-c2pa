[package]
name = "encypher-c2pa-trust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
description = "Static trust evaluation used by the Encypher C2PA verifier"

[lib]
name = "c2pa_trust"

[dependencies]
thiserror = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true, features = ["oid"] }
time = { workspace = true }
der = { workspace = true }
const-oid = { workspace = true }
spki = { workspace = true }
x509-cert = { workspace = true, features = ["pem"] }
cms = { workspace = true }
x509-tsp = { workspace = true }
ecdsa = { workspace = true }
p256 = { workspace = true, features = ["ecdsa"] }
p384 = { workspace = true, features = ["ecdsa"] }
p521 = { workspace = true, features = ["ecdsa"] }
rsa = { workspace = true }
ed25519-dalek = { workspace = true }

[dev-dependencies]
time = { workspace = true, features = ["macros"] }
rcgen = "0.14"
